# Google OAuth — enable in Dashboard → Authentication → Providers → Google
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = true

[auth]
site_url = "https://metreka-zvhr.vercel.app"
additional_redirect_urls = [
  "http://localhost:8080/auth/callback",
  "https://metreka-zvhr.vercel.app/auth/callback",
  "http://localhost:8080/oauth/callback",
  "https://metreka-zvhr.vercel.app/oauth/callback",
]

[functions.create-checkout]
verify_jwt = false

[functions.check-subscription]
verify_jwt = false

[functions.customer-portal]
verify_jwt = false

[functions.sync-store-data]
verify_jwt = false

[functions.store-connect]
